version: "3.9"

# ════════════════════════════════════════════════════════════════════════════
# Enterprise Data Governance Platform — Docker Compose
# Services: API, PostgreSQL, Neo4j, Redis, Airflow, Marquez, Frontend
# ════════════════════════════════════════════════════════════════════════════

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg="
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LINEAGE__BACKEND: openlineage.airflow.backend.OpenLineageBackend
    OPENLINEAGE_URL: http://marquez:5000
    OPENLINEAGE_NAMESPACE: enterprise-governance
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL (Primary metadata store) ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: governance-postgres
    environment:
      POSTGRES_USER: governance_user
      POSTGRES_PASSWORD: governance_pass
      POSTGRES_DB: governance_db
      POSTGRES_MULTIPLE_DATABASES: airflow,marquez
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance_user -d governance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Neo4j (Lineage graph database) ──────────────────────────────────────
  neo4j:
    image: neo4j:5.15-enterprise
    container_name: governance-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_pass
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4JLABS_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Redis (API caching) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: governance-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── Governance API (FastAPI) ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: governance-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: governance_db
      POSTGRES_USER: governance_user
      POSTGRES_PASSWORD: governance_pass
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_pass
      REDIS_URL: redis://redis:6379/0
      MARQUEZ_URL: http://marquez:5000
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Marquez (OpenLineage metadata server) ────────────────────────────────
  marquez:
    image: marquezproject/marquez:0.44.0
    container_name: governance-marquez
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      MARQUEZ_DB_HOST: postgres
      MARQUEZ_DB_PORT: 5432
      MARQUEZ_DB_USER: governance_user
      MARQUEZ_DB_PASSWORD: governance_pass
      MARQUEZ_DB: marquez
    ports:
      - "5000:5000"   # API
      - "5001:5001"   # Admin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Airflow Webserver ────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: governance-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: governance-airflow-scheduler
    command: scheduler
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: governance-airflow-init
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create --username admin --password admin
          --firstname Admin --lastname User --role Admin --email admin@enterprise.com
      "
    restart: on-failure

  # ── React Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: governance-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  airflow_logs:

networks:
  default:
    name: governance-network
